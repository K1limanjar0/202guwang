<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14313c">
<title>202股王大赛</title>
<link rel="preconnect" href="https://cdn.tailwindcss.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* ========== 基础与背景 ========== */
  body {
    background: #f8fafc;
    background-image: radial-gradient(circle, #e2e8f0 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(15,118,110,0.14);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .skip-link {
    position: fixed;
    left: 16px;
    top: 12px;
    z-index: 999;
    transform: translateY(-150%);
    background: #fff;
    color: #0f172a;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    padding: 8px 12px;
    box-shadow: 0 10px 24px rgba(15,23,42,0.18);
    transition: transform 0.18s ease;
  }

  .skip-link:focus-visible {
    transform: translateY(0);
  }

  button:focus-visible,
  input:focus-visible,
  .chart-toggle:focus-visible {
    outline: 3px solid rgba(15,118,110,0.32);
    outline-offset: 2px;
  }

  /* ========== 卡片 ========== */
  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(226,232,240,0.8);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.03);
    transition: box-shadow 0.3s, transform 0.3s;
  }
  .card:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05); }

  /* ========== 按钮 ========== */
  .btn {
    transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1), background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
    box-shadow: 0 2px 8px rgba(99,102,241,0.35);
  }
  .btn-primary:hover {
    box-shadow: 0 4px 16px rgba(99,102,241,0.45);
    transform: translateY(-1px);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(203,213,225,0.6);
    color: #475569;
  }
  .btn-ghost:hover { background: rgba(248,250,252,0.9); border-color: #94a3b8; }

  /* ========== 数据表格 ========== */
  .sticky-left { position: sticky; left: 0; z-index: 5; background: inherit; }
  .sticky-left-2 { position: sticky; left: 140px; z-index: 4; background: inherit; }
  thead th {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #f8fafc, #f1f5f9);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.7rem;
    color: #64748b;
  }
  thead th.sticky-left { z-index: 12; }
  thead th.sticky-left-2 { z-index: 11; }
  .table-cell-input {
    width: 100px; text-align: center;
    border: 1.5px solid transparent; border-radius: 10px;
    padding: 8px 6px; transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    background: rgba(248,250,252,0.6);
    font-variant-numeric: tabular-nums;
  }
  .table-cell-input:hover { border-color: #cbd5e1; background: #fff; }
  .table-cell-input:focus {
    border-color: #818cf8; background: #fff;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
  }
  .table-row { transition: background-color 0.15s ease; }
  .table-row:hover { background: rgba(238,242,255,0.5) !important; }

  /* ========== 收益率颜色 ========== */
  .return-positive { color: #ef4444; font-weight: 600; }
  .return-negative { color: #10b981; font-weight: 600; }

  /* ========== 模态框 ========== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    z-index: 50; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); animation: fadeIn 0.2s ease;
  }
  .modal {
    background: white; border-radius: 24px; padding: 28px;
    width: 90%; max-width: 460px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.2);
    animation: modalIn 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes modalIn { from { transform: scale(0.92) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ========== Toast ========== */
  .toast {
    position: fixed; top: 24px; right: 24px; z-index: 100;
    animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes slideIn { from { transform: translateX(120%) scale(0.9); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

  /* ========== 排名徽章 ========== */
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 12px;
    font-weight: 700; font-size: 15px;
  }
  .rank-1 { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #b45309; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
  .rank-2 { background: linear-gradient(135deg, #f1f5f9, #e2e8f0); color: #475569; }
  .rank-3 { background: linear-gradient(135deg, #fef2f2, #fee2e2); color: #b45309; }

  /* ========== 图表切换 ========== */
  .chart-toggle {
    cursor: pointer; padding: 8px 20px; border-radius: 24px;
    font-size: 13px; font-weight: 600; transition: background-color 0.25s cubic-bezier(0.4,0,0.2,1), color 0.25s cubic-bezier(0.4,0,0.2,1), box-shadow 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .chart-toggle.active {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
    box-shadow: 0 2px 8px rgba(99,102,241,0.35);
  }
  .chart-toggle:not(.active) { background: transparent; color: #94a3b8; }
  .chart-toggle:not(.active):hover { color: #6366f1; background: rgba(99,102,241,0.06); }

  /* ========== 滚动条 ========== */
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* ========== 自定义输入框 ========== */
  .input-modern {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    background: #f8fafc;
  }
  .input-modern:focus {
    border-color: #818cf8; background: white;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  .input-modern::placeholder { color: #94a3b8; }

  /* ========== 斑马纹和悬停 ========== */
  .row-even { background: rgba(255,255,255,0.6); }
  .row-odd { background: rgba(248,250,252,0.5); }
  .row-hover:hover { background: rgba(238,242,255,0.6) !important; }

  /* ========== 入场动画 ========== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeInUp 0.4s ease both; }
  .delay-1 { animation-delay: 0.05s; }
  .delay-2 { animation-delay: 0.1s; }
  .delay-3 { animation-delay: 0.15s; }

  /* ========== 统计数字跳动 ========== */
  @keyframes countIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .stat-number { animation: countIn 0.4s cubic-bezier(0.4,0,0.2,1) both; }

  /* ========== 脉冲指示 ========== */
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .live-dot { animation: pulse-dot 2s ease-in-out infinite; }

  /* ========== 现代表单 ========== */
  .form-label { font-size: 0.8rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ========== 视觉优化覆盖层 ========== */
  :root {
    --ink: #111827;
    --muted: #64748b;
    --line: #dbe3ee;
    --panel: rgba(255,255,255,0.94);
    --brand: #2563eb;
    --brand-dark: #1d4ed8;
    --accent: #0f766e;
    --gold: #d97706;
  }

  body {
    color: var(--ink);
    background:
      linear-gradient(180deg, #f5f7fb 0%, #eef3f8 46%, #f8fafc 100%),
      repeating-linear-gradient(90deg, transparent 0 31px, rgba(148,163,184,0.12) 31px 32px);
  }

  header {
    background:
      linear-gradient(135deg, #111827 0%, #14313c 48%, #0f766e 100%) !important;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }

  header::after {
    content: "";
    position: absolute;
    inset: auto 0 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  }

  header > .absolute {
    opacity: 0.045 !important;
    filter: grayscale(1);
  }

  header h1 {
    letter-spacing: 0;
  }

  header p {
    color: rgba(220,252,231,0.78) !important;
  }

  main {
    margin-top: -18px;
    position: relative;
    z-index: 2;
  }

  .card {
    background: var(--panel);
    border: 1px solid rgba(203,213,225,0.86);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(15,23,42,0.07);
  }

  .card:hover {
    box-shadow: 0 14px 38px rgba(15,23,42,0.1);
  }

  #statsCards {
    align-items: stretch;
  }

  #statsCards > div {
    min-width: 104px;
    border-radius: 8px !important;
    background: rgba(255,255,255,0.12) !important;
    border-color: rgba(255,255,255,0.18) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }

  #toolbar {
    padding: 14px;
    gap: 10px;
  }

  .btn {
    border-radius: 8px !important;
    letter-spacing: 0;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    box-shadow: 0 8px 18px rgba(37,99,235,0.24);
  }

  .btn-primary:hover {
    box-shadow: 0 10px 24px rgba(37,99,235,0.3);
  }

  .btn-ghost {
    background: #fff;
    border-color: var(--line);
    color: #334155;
  }

  .btn-ghost:hover {
    background: #f8fafc;
    border-color: #94a3b8;
  }

  #yuebaoSettings .w-10 {
    border-radius: 8px !important;
    background: #fff7ed !important;
    color: var(--gold);
  }

  #tableSection > div:first-child,
  #rankingSection > div:first-child {
    background: linear-gradient(180deg, #fff, #f8fafc);
    border-bottom-color: var(--line);
  }

  #tableSection h2,
  #chartSection h2,
  #rankingSection h2 {
    color: #0f172a;
    font-size: 15px;
  }

  #tableSection h2 i,
  #chartSection h2 i,
  #rankingSection h2 i {
    color: var(--accent) !important;
  }

  thead th {
    background: #f8fafc;
    color: #475569;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--line) !important;
  }

  tbody td {
    border-bottom-color: #eef2f7 !important;
  }

  .row-even,
  .row-odd {
    background: #fff;
  }

  .table-row:hover,
  .row-hover:hover {
    background: #f1f8f7 !important;
  }

  .table-cell-input {
    width: 108px;
    border-radius: 7px;
    border: 1px solid #e2e8f0;
    background: #fff;
  }

  .table-cell-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15,118,110,0.12);
  }

  .return-positive { color: #dc2626; }
  .return-negative { color: #059669; }

  .chart-toggle {
    border-radius: 7px;
    padding: 7px 16px;
  }

  .chart-toggle.active {
    background: #0f766e;
    box-shadow: 0 8px 18px rgba(15,118,110,0.2);
  }

  .chart-toggle:not(.active):hover {
    color: #0f766e;
    background: rgba(15,118,110,0.08);
  }

  #chartSection .relative {
    border: 1px solid #edf2f7;
    border-radius: 8px;
    background: linear-gradient(180deg, #fff, #fbfdff);
    padding: 12px;
  }

  .rank-badge {
    border-radius: 8px;
  }

  .rank-1 {
    background: #fff7ed;
    color: #c2410c;
    box-shadow: inset 0 0 0 1px #fed7aa;
  }

  .rank-2 {
    background: #f8fafc;
    box-shadow: inset 0 0 0 1px #e2e8f0;
  }

  .rank-3 {
    background: #fef2f2;
    color: #b45309;
    box-shadow: inset 0 0 0 1px #fecaca;
  }

  .modal {
    border-radius: 10px;
    box-shadow: 0 30px 80px rgba(15,23,42,0.28);
  }

  .input-modern {
    border-radius: 8px;
  }

  .input-modern:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15,118,110,0.12);
  }

  .toast > div {
    border-radius: 8px !important;
  }

  #dataTable,
  #rankingTable {
    border-collapse: separate;
    border-spacing: 0;
  }

  #dataTable th,
  #dataTable td,
  #rankingTable th,
  #rankingTable td {
    white-space: nowrap;
  }

  #tableContainer {
    scrollbar-gutter: stable;
  }

  #toolbar button[onclick="resetData()"] {
    background: #fff;
    border-color: #fecdd3;
  }

  #toolbar button[onclick="resetData()"]:hover {
    background: #fff1f2;
  }

  @media (max-width: 640px) {
    header .relative {
      padding-top: 28px !important;
      padding-bottom: 40px !important;
    }

    header h1 {
      font-size: 1.6rem !important;
      line-height: 1.2;
    }

    #statsCards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: 100%;
    }

    #statsCards > div {
      min-width: 0;
    }

    main {
      margin-top: -24px;
      padding-left: 12px !important;
      padding-right: 12px !important;
    }

    #toolbar button {
      flex: 1 1 calc(50% - 8px);
      justify-content: center;
    }

    #toolbar button:nth-of-type(n+5) {
      flex: 1 1 calc(33.333% - 8px);
      min-height: 40px;
    }

    #toolbar button[onclick="resetData()"] {
      flex: 1 1 calc(33.333% - 8px);
    }

    #dataTable {
      min-width: 720px;
    }

    #rankingTable {
      min-width: 760px;
    }

    .sticky-left {
      left: 0;
      width: 112px;
      min-width: 112px;
      max-width: 112px;
    }

    .sticky-left-2 {
      left: 112px;
      width: 112px;
      min-width: 112px;
      max-width: 112px;
    }

    #chartSection .relative {
      height: 320px !important;
    }
  }

  /* ========== 第二版视觉精修：更像数据看板 ========== */
  :root {
    --page: #f4f7fb;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --ink-strong: #0f172a;
    --ink: #1f2937;
    --ink-muted: #64748b;
    --line-soft: #e5edf5;
    --line: #d8e2ee;
    --brand: #dc2626;
    --brand-strong: #b91c1c;
    --brand-soft: #fff1f2;
    --blue: #2563eb;
    --up-red: #dc2626;
    --down-green: #059669;
    --gold: #b7791f;
  }

  body {
    color: var(--ink);
    background:
      linear-gradient(180deg, #eef4f8 0, var(--page) 220px, #f8fafc 100%),
      linear-gradient(90deg, rgba(15,23,42,0.035) 1px, transparent 1px),
      linear-gradient(180deg, rgba(15,23,42,0.035) 1px, transparent 1px);
    background-size: auto, 32px 32px, 32px 32px;
  }

  .site-header {
    background:
      linear-gradient(135deg, #2a1111 0%, #5f1717 48%, #991b1b 100%) !important;
    min-height: 184px;
    isolation: isolate;
  }

  .site-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(120deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 112px),
      linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 48%, transparent 100%);
    background-size: 112px 100%, 100% 100%;
    opacity: 0.52;
    pointer-events: none;
  }

  .market-grid {
    opacity: 0.22;
    background-image:
      linear-gradient(rgba(255,255,255,0.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent);
  }

  .brand-mark {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fee2e2;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(254,202,202,0.24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .live-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 5px 9px;
    color: #fecaca;
    background: rgba(248,113,113,0.13);
    border: 1px solid rgba(254,202,202,0.26);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .dashboard-layout {
    margin-top: -34px;
  }

  .card {
    background: rgba(255,255,255,0.96);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 14px 36px rgba(15,23,42,0.08);
  }

  .card:hover {
    box-shadow: 0 18px 42px rgba(15,23,42,0.1);
  }

  #statsCards {
    display: grid;
    grid-template-columns: repeat(5, minmax(108px, 1fr));
    gap: 10px;
    width: min(720px, 100%);
  }

  #statsCards > div {
    min-width: 0 !important;
    border-radius: 8px !important;
    padding: 13px 14px !important;
    text-align: left !important;
    background: rgba(255,255,255,0.105) !important;
    border: 1px solid rgba(255,255,255,0.16) !important;
  }

  #statsCards .stat-number,
  #statsCards .text-base {
    line-height: 1.08;
    font-variant-numeric: tabular-nums;
  }

  #statsCards div[class*="uppercase"] {
    margin-top: 5px;
    color: rgba(226,232,240,0.76) !important;
    letter-spacing: 0;
  }

  #statsCards .stock-up {
    color: #fca5a5;
  }

  #statsCards .stock-down {
    color: #6ee7b7;
  }

  .live-chip .live-dot {
    background: #fca5a5 !important;
  }

  #toolbar {
    position: sticky;
    top: 12px;
    z-index: 30;
    padding: 12px;
    gap: 8px;
    align-items: center;
  }

  .btn {
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px !important;
    font-weight: 650;
    letter-spacing: 0;
  }

  .btn i {
    font-size: 14px;
  }

  .btn-primary {
    background: var(--brand);
    box-shadow: 0 10px 20px rgba(15,118,110,0.2);
  }

  .btn-primary:hover {
    background: var(--brand-strong);
    box-shadow: 0 14px 24px rgba(15,118,110,0.24);
  }

  .btn-ghost {
    background: var(--surface);
    border-color: var(--line);
    color: #334155;
  }

  .btn-ghost:hover {
    background: #f8fbfd;
    border-color: #b8c7d8;
    color: #0f172a;
  }

  #toolbar .h-6 {
    background: var(--line);
    opacity: 0.8;
  }

  #tokenBadge {
    border-radius: 999px !important;
    background: #fff1f2 !important;
    color: #be123c !important;
  }

<div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
// ==================== 数据管理（GitHub API 同步）====================
const REPO_OWNER = 'K1limanjar0';
const REPO_NAME = '202guwang';
const DATA_FILE = 'data.json';
const LOCAL_DATA_KEY = 'stock_king_local_draft_v1';
const RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DATA_FILE}`;
const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`;

const COLORS = ['#4F46E5','#EF4444','#10B981','#F59E0B','#8B5CF6','#EC4899','#06B6D4','#F97316','#84CC16','#6366F1','#14B8A6','#E11D48'];

let data = { members: [], weeks: [], yuEBao: { enabled: true, annualRate: 1.8, initialCapital: 100000 } };
let chartMode = 'absolute';
let chart = null;
let saving = false;
let dataSha = null;
let githubToken = localStorage.getItem('gh_token_202guwang') || '';
let dataDirty = false;  // 标记本地有未同步的修改

function normalizeData(parsed) {
  const defaultYuEBao = { enabled: true, annualRate: 1.8, initialCapital: 100000 };
  return { members: parsed.members || [], weeks: parsed.weeks || [], yuEBao: parsed.yuEBao || defaultYuEBao };
}

function loadLocalDraft() {
  try {
    const raw = localStorage.getItem(LOCAL_DATA_KEY);
    if (!raw) return false;
    data = normalizeData(JSON.parse(raw));
    dataDirty = true;
    return true;
  } catch (e) {
    localStorage.removeItem(LOCAL_DATA_KEY);
    return false;
  }
}

function saveLocalDraft(showTip = true) {
  localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data));
  dataDirty = true;
  renderAll();
  if (showTip) showToast('✅ 已保存到本地，点击上传按钮同步到 GitHub');
}

async function loadData(options = {}) {
  if (!options.forceRemote && loadLocalDraft()) return;
  try {
    const resp = await fetch(RAW_URL + '?_=' + Date.now());
    if (resp.ok) {
      const parsed = await resp.json();
      data = normalizeData(parsed);
      dataDirty = false;
    }
  } catch (e) { console.error('加载数据失败:', e); }
}

async function fetchLatestSha() {
  if (!githubToken) return null;
  try {
    const resp = await fetch(API_URL + '?_=' + Date.now(), {
      headers: { 'Authorization': 'Bearer ' + githubToken }
    });
    if (resp.ok) {
      const info = await resp.json();
      dataSha = info.sha;
      return info.sha;
    } else {
      console.error('SHA fetch failed:', resp.status, await resp.text());
    }
  } catch(e) {
    console.error('SHA fetch error:', e);
  }
  return null;
}

async function saveData(silent) {
  if (saving) return;
  if (!githubToken) {
    dataDirty = true;
    if (!silent) { showToast('🔑 请先设置 GitHub Token'); showTokenModal(); }
    else { showToast('⚠️ 未设置 Token，修改仅保存在本地（刷新会丢失）'); }
    return;
  }
  saving = true;
  try {
    // 先获取最新 SHA（必须成功才能继续）
    const sha = await fetchLatestSha();
    if (!sha) {
      showToast('❌ 无法获取文件信息，请检查 Token 权限（需要 Contents: Read and write）');
      saving = false;
      return;
    }

    // 上传数据
    const jsonStr = JSON.stringify(data, null, 2);
    const content = btoa(unescape(encodeURIComponent(jsonStr)));
    const resp = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + githubToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: '更新数据 ' + new Date().toLocaleString('zh-CN'), content, sha })
    });

    if (resp.ok) {
      const result = await resp.json();
      dataSha = result.content.sha;
      dataDirty = false;
      localStorage.removeItem(LOCAL_DATA_KEY);
      renderAll();
      if (!silent) showToast('✅ 数据已同步');
    } else {
      dataDirty = true;
      const err = await resp.json().catch(() => ({}));
      showToast('❌ ' + (err.message || '保存失败，检查Token'));
    }
  } catch (e) {
    dataDirty = true;
    showToast('❌ 网络错误，同步失败');
  }
  saving = false;
}

function autoSave(showTip = true) { saveLocalDraft(showTip); }

async function refreshData() {
  if (dataDirty && !confirm('当前有未上传到 GitHub 的本地修改。\n\n继续刷新会丢弃本地草稿并拉取远端数据，确定继续吗？')) return;
  localStorage.removeItem(LOCAL_DATA_KEY);
  dataDirty = false;
  await loadData({ forceRemote: true });
  renderAll();
  showToast('🔄 已从 GitHub 拉取最新数据');
}

function setGitHubToken(token) {
  githubToken = token.trim();
  if (githubToken) {
    localStorage.setItem('gh_token_202guwang', githubToken);
  } else {
    localStorage.removeItem('gh_token_202guwang');
  }
  updateTokenBadge();
}

function updateTokenBadge() {
  const badge = document.getElementById('tokenBadge');
  if (badge) {
    badge.className = githubToken ? 'text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold' : 'text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold cursor-pointer';
    badge.textContent = githubToken ? '可写入' : '只读';
    badge.title = githubToken ? 'Token 已设置，点击上传按钮才会同步到 GitHub' : '点击设置 Token 以写入数据';
    badge.onclick = githubToken ? null : showTokenModal;
  }
}

function showTokenModal() {
  const token = prompt('请输入 GitHub Personal Access Token（Fine-grained token）：\n\n1. 打开 https://github.com/settings/tokens\n2. 创建 Fine-grained token\n3. 选择仓库 K1limanjar0/202guwang\n4. 权限勾选 Contents (Read and write)\n5. 复制 token 粘贴到这里\n\n留空可清除已保存的 token（变为只读模式）', githubToken);
  if (token !== null) {
    setGitHubToken(token);
    if (token) showToast('✅ Token 已保存，点击上传按钮同步数据'); else showToast('📖 已切换为只读模式');
    location.reload();
  }
}

// ==================== 成员操作 ====================
function addMember(name, initialCapital) {
  const id = 'm' + Date.now();
  const colorIdx = data.members.length % COLORS.length;
  data.members.push({ id, name, initialCapital: parseFloat(initialCapital) || 100000, color: COLORS[colorIdx] });
  autoSave();
}

function updateMember(id, name, initialCapital) {
  const m = data.members.find(x => x.id === id);
  if (m) { m.name = name; m.initialCapital = parseFloat(initialCapital) || 100000; }
  autoSave();
}

function deleteMember(id) {
  if (!confirm('确定要删除该成员及其所有数据吗？此操作不可撤销。')) return;
  data.members = data.members.filter(m => m.id !== id);
  data.weeks.forEach(w => { delete w.values[id]; });
  autoSave();
}

// ==================== 周操作 ====================
function addWeek() {
  if (data.members.length === 0) { showToast('⚠️ 请先添加成员'); return; }
  const n = data.weeks.length + 1;
  const id = 'w' + Date.now();
  const today = new Date().toISOString().split('T')[0];
  const values = {};
  data.members.forEach(m => { values[m.id] = null; });
  data.weeks.push({ id, label: `第${n}周`, date: today, values });
  autoSave();
}

function deleteWeek(id) {
  if (!confirm('确定要删除该周的所有记录吗？此操作不可撤销。')) return;
  data.weeks = data.weeks.filter(w => w.id !== id);
  // Re-label remaining weeks
  data.weeks.forEach((w, i) => { w.label = `第${i + 1}周`; });
  autoSave();
}

function updateWeekValue(weekId, memberId, value) {
  const week = data.weeks.find(w => w.id === weekId);
  if (!week) return;
  week.values[memberId] = value === '' || value === null ? null : parseFloat(value);
  autoSave();
}

function updateWeekLabel(weekId, newLabel) {
  const week = data.weeks.find(w => w.id === weekId);
  if (week) { week.label = newLabel; autoSave(); }
}

function updateWeekDate(weekId, newDate) {
  const week = data.weeks.find(w => w.id === weekId);
  if (week) { week.date = newDate; autoSave(); }
}

// ==================== 计算 ====================
function getReturnRate(member, weekValue) {
  if (weekValue === null || weekValue === undefined || member.initialCapital === 0) return null;
  return ((weekValue - member.initialCapital) / member.initialCapital * 100);
}

function getLatestReturnRate(member) {
  let lastVal = null;
  for (let i = data.weeks.length - 1; i >= 0; i--) {
    const v = data.weeks[i].values[member.id];
    if (v !== null && v !== undefined) { lastVal = v; break; }
  }
  return lastVal !== null ? getReturnRate(member, lastVal) : null;
}

function getLatestValue(member) {
  for (let i = data.weeks.length - 1; i >= 0; i--) {
    const v = data.weeks[i].values[member.id];
    if (v !== null && v !== undefined) return v;
  }
  return null;
}

function getReturnEmoji(returnRate) {
  if (returnRate === null || returnRate === undefined) return '';
  if (returnRate > 0) return ' ↑';
  if (returnRate < 0) return ' ↓';
  return ' -';
}

function getMemberDisplayName(member) {
  return `${member.name}${getReturnEmoji(getLatestReturnRate(member))}`;
}

function getRanking() {
  return data.members
    .map(m => ({ ...m, returnRate: getLatestReturnRate(m), latestValue: getLatestValue(m) }))
    .sort((a, b) => {
      if (a.returnRate === null && b.returnRate === null) return 0;
      if (a.returnRate === null) return 1;
      if (b.returnRate === null) return -1;
      return b.returnRate - a.returnRate;
    });
}

// ==================== 余额宝基准计算 ====================
function getYuEBaoValue(weekIndex) {
  if (!data.yuEBao || !data.yuEBao.enabled) return null;
  const { annualRate, initialCapital } = data.yuEBao;
  const weeklyRate = Math.pow(1 + annualRate / 100, 1 / 52) - 1;
  return Math.round(initialCapital * Math.pow(1 + weeklyRate, weekIndex + 1));
}

function getYuEBaoReturnRate(weekIndex) {
  if (!data.yuEBao || !data.yuEBao.enabled) return null;
  const value = getYuEBaoValue(weekIndex);
  if (value === null) return null;
  return ((value - data.yuEBao.initialCapital) / data.yuEBao.initialCapital * 100);
}

function getYuEBaoLatestReturnRate() {
  if (data.weeks.length === 0) return null;
  return getYuEBaoReturnRate(data.weeks.length - 1);
}

function getYuEBaoLatestValue() {
  if (data.weeks.length === 0) return null;
  return getYuEBaoValue(data.weeks.length - 1);
}

function saveYuEBaoSettings() {
  const enabled = document.getElementById('yuebaoEnabled').checked;
  const annualRate = parseFloat(document.getElementById('yuebaoRate').value) || 1.8;
  const initialCapital = parseFloat(document.getElementById('yuebaoCapital').value) || 100000;
  data.yuEBao = { enabled, annualRate, initialCapital };
  autoSave();
}

// ==================== 渲染 ====================

  renderEmptyState();
  renderYuEBaoSettings();
  renderTable();
  renderChart();
  renderRanking();
  renderStats();
  updateDemoButton();
}

function renderEmptyState() {
  const empty = document.getElementById('emptyState');
  const table = document.getElementById('tableSection');
  const chartS = document.getElementById('chartSection');
  const rankS = document.getElementById('rankingSection');
  const ybSettings = document.getElementById('yuebaoSettings');

  if (data.members.length === 0 && data.weeks.length === 0) {
    empty.classList.remove('hidden');
    table.classList.add('hidden');
    chartS.classList.add('hidden');
    rankS.classList.add('hidden');
    ybSettings.classList.add('hidden');
  } else {
    empty.classList.add('hidden');
    table.classList.remove('hidden');
    chartS.classList.remove('hidden');
    rankS.classList.remove('hidden');
    ybSettings.classList.remove('hidden');
  }
}

function renderYuEBaoSettings() {
  if (data.yuEBao) {
    document.getElementById('yuebaoEnabled').checked = data.yuEBao.enabled;
    document.getElementById('yuebaoRate').value = data.yuEBao.annualRate;
    document.getElementById('yuebaoCapital').value = data.yuEBao.initialCapital;
  }
}

  const topMember = ranking.length > 0 && ranking[0].returnRate !== null ? ranking[0] : null;
  let avgReturn = null;
  const returns = ranking.map(r => r.returnRate).filter(r => r !== null);
  if (returns.length > 0) avgReturn = returns.reduce((a, b) => a + b, 0) / returns.length;

  // 跑赢余额宝的人数
  let beatYuEBao = null;
  if (data.yuEBao && data.yuEBao.enabled && data.weeks.length > 0) {
    const ybRR = getYuEBaoLatestReturnRate();
    if (ybRR !== null) {
      beatYuEBao = ranking.filter(r => r.returnRate !== null && r.returnRate > ybRR).length;
    }
  }

  container.innerHTML = `
    <div class="bg-white/10 backdrop-blur-md rounded-2xl px-5 py-3 text-center min-w-[80px] border border-white/10">
      <div class="stat-number text-2xl font-extrabold text-white">${totalMembers}</div>
      <div class="text-[11px] text-indigo-200/80 font-medium tracking-wide uppercase">参赛成员</div>
    </div>
    <div class="bg-white/10 backdrop-blur-md rounded-2xl px-5 py-3 text-center min-w-[80px] border border-white/10">
      <div class="stat-number text-2xl font-extrabold text-white">${totalWeeks}</div>
      <div class="text-[11px] text-indigo-200/80 font-medium tracking-wide uppercase">记录周数</div>
    </div>
    ${topMember ? `
    <div class="bg-white/10 backdrop-blur-md rounded-2xl px-5 py-3 text-center min-w-[90px] border border-white/10">
      <div class="text-base font-bold text-white truncate max-w-[110px] flex items-center justify-center gap-1">
        <span class="text-amber-400">👑</span> ${escapeHtml(`${topMember.name}${getReturnEmoji(topMember.returnRate)}`)}
      </div>
      <div class="text-xs font-bold ${topMember.returnRate >= 0 ? 'stock-up' : 'stock-down'}">${topMember.returnRate >= 0 ? '+' : ''}${topMember.returnRate.toFixed(2)}%</div>
    </div>` : ''}
    ${avgReturn !== null ? `
    <div class="bg-white/10 backdrop-blur-md rounded-2xl px-5 py-3 text-center min-w-[80px] border border-white/10">
      <div class="text-base font-extrabold ${avgReturn >= 0 ? 'stock-up' : 'stock-down'}">${avgReturn >= 0 ? '+' : ''}${avgReturn.toFixed(2)}%</div>
      <div class="text-[11px] text-indigo-200/80 font-medium tracking-wide uppercase">平均收益</div>
    </div>` : ''}
    ${beatYuEBao !== null ? `
    <div class="bg-white/10 backdrop-blur-md rounded-2xl px-5 py-3 text-center min-w-[90px] border border-white/10">
      <div class="text-base font-extrabold text-white">${beatYuEBao}/${totalMembers}</div>
      <div class="text-[11px] text-amber-300/90 font-medium tracking-wide uppercase">跑赢余额宝 💰</div>
    </div>` : ''}
  `;
}

function renderChart() {
  const canvas = document.getElementById('mainChart');
  const ctx = canvas.getContext('2d');

  if (chart) { chart.destroy(); chart = null; }

  if (data.members.length === 0 || data.weeks.length === 0) {
    // Draw empty state on canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '16px -apple-system, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据，请添加成员和周记录', canvas.width / 2, canvas.height / 2);
    return;
  }

  const labels = ['初始', ...data.weeks.map(w => w.label)];

  // 为每个成员创建渐变色
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const datasets = data.members.map(member => {
    const displayName = getMemberDisplayName(member);
    // 创建 canvas 渐变（在 afterLayout 中处理）
    return {
      label: displayName,
      data: [
        chartMode === 'absolute' ? member.initialCapital : 0,
        ...data.weeks.map(w => {
        const v = w.values[member.id];
        if (v === null || v === undefined) return null;
        if (chartMode === 'absolute') return v;
        return parseFloat(getReturnRate(member, v).toFixed(2));
        })
      ],
      borderColor: member.color,
      backgroundColor: hexToRgba(member.color, 0.08),
      borderWidth: 3,
      pointRadius: 5,
      pointHoverRadius: 8,
      pointBackgroundColor: member.color,
      pointBorderColor: 'white',
      pointBorderWidth: 3,
      tension: 0.4,
      spanGaps: false,
      fill: true,
    };
  });

  // 余额宝基准线
  if (data.yuEBao && data.yuEBao.enabled && data.weeks.length > 0) {
    const ybColor = '#F59E0B';
    datasets.push({
      label: '💰 余额宝基准',
      data: [
        chartMode === 'absolute' ? data.yuEBao.initialCapital : 0,
        ...data.weeks.map((_, i) => {
          if (chartMode === 'absolute') return getYuEBaoValue(i);
          return parseFloat(getYuEBaoReturnRate(i).toFixed(2));
        })
      ],
      borderColor: ybColor,
      backgroundColor: 'rgba(245,158,11,0.06)',
      borderWidth: 3,
      borderDash: [8, 4],
      pointRadius: 4,
      pointHoverRadius: 7,
      pointBackgroundColor: ybColor,
      pointBorderColor: 'white',
      pointBorderWidth: 2,
      pointStyle: 'rectRounded',
      tension: 0.4,
      spanGaps: false,
      fill: true,
      order: 1,
    });
  }

  // 余额宝基准线颜色零线 (收益率模式)
  const ybZeroLine = {
    id: 'ybZeroLine',
    afterDraw(chart) {
      if (chartMode === 'return') {
        const yScale = chart.scales.y;
        const xScale = chart.scales.x;
        const yPos = yScale.getPixelForValue(0);
        if (yPos >= yScale.top && yPos <= yScale.bottom) {
          const ctx = chart.ctx;
          ctx.save();
          ctx.beginPath();
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1;
          ctx.moveTo(xScale.left, yPos);
          ctx.lineTo(xScale.right, yPos);
          ctx.stroke();
          ctx.restore();
        }
      }
    }
  };

  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    plugins: [ybZeroLine],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            usePointStyle: true, pointStyleWidth: 10, padding: 24,
            font: { size: 13, family: "-apple-system, 'Microsoft YaHei', sans-serif", weight: '500' },
            color: '#475569',
            generateLabels: function(chart) {
              const items = Chart.defaults.plugins.legend.labels.generateLabels(chart);
              return items.map(item => ({
                ...item,
                fillStyle: item.datasetIndex < data.members.length ?
                  hexToRgba(data.members[item.datasetIndex].color, 0.15) : 'transparent'
              }));
            }
          }
        },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,0.92)',
          titleFont: { size: 13, weight: '600' },
          bodyFont: { size: 13 },
          padding: 14,
          cornerRadius: 12,
          displayColors: true,
          boxPadding: 6,
          callbacks: {
            label: function(ctx) {
              if (ctx.parsed.y === null || ctx.parsed.y === undefined) return ctx.dataset.label + ': 无数据';
              if (chartMode === 'absolute') return ctx.dataset.label + ': ¥' + ctx.parsed.y.toLocaleString();
              return ctx.dataset.label + ': ' + (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + '%';
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 12, weight: '500' }, color: '#94a3b8' }
        },
        y: {
          grid: { color: '#f1f5f9', drawBorder: false },
          border: { display: false },
          ticks: {
            font: { size: 11 },
            color: '#94a3b8',
            padding: 8,
            callback: function(v) {
              if (chartMode === 'absolute') {
                if (v >= 10000) return (v / 10000).toFixed(1) + '万';
                return v.toLocaleString();
              }
              return v.toFixed(1) + '%';
            }
          }
        }
      }
    }
  });
}

      <td class="px-4 py-4 text-right font-mono font-medium text-gray-800">${ybLatest !== null ? '¥' + ybLatest.toLocaleString() : '-'}</td>
      <td class="px-4 py-4 text-right font-mono font-medium ${ybProfit !== null ? (ybProfit >= 0 ? 'return-positive' : 'return-negative') : 'text-gray-400'}">${ybProfit !== null ? (ybProfit >= 0 ? '+' : '') + ybProfit.toLocaleString() : '-'}</td>
      <td class="px-4 py-4 text-right font-mono font-bold text-base ${ybRR !== null ? (ybRR >= 0 ? 'return-positive' : 'return-negative') : 'text-gray-400'}">${ybRR !== null ? (ybRR >= 0 ? '+' : '') + ybRR.toFixed(2) + '%' : '-'}</td>
    </tr>`;
  }

  html += '</tbody>';
  table.innerHTML = html;
}

function updateDemoButton() {
  const btn = document.getElementById('btnDemo');
  if (data.members.length === 0 && data.weeks.length === 0) {
    btn.classList.remove('hidden');
  } else {
    btn.classList.add('hidden');
  }
}

function switchChartMode(mode) {
  chartMode = mode;
  document.getElementById('toggleAbsolute').classList.toggle('active', mode === 'absolute');
  document.getElementById('toggleReturn').classList.toggle('active', mode === 'return');
  document.getElementById('toggleAbsolute').setAttribute('aria-pressed', mode === 'absolute' ? 'true' : 'false');
  document.getElementById('toggleReturn').setAttribute('aria-pressed', mode === 'return' ? 'true' : 'false');
  renderChart();
}

// ==================== 模态框 ====================
function showMemberModal(editId) {
  const modal = document.getElementById('memberModal');
  const title = document.getElementById('memberModalTitle');
  document.getElementById('memberEditId').value = editId || '';
  if (editId) {
    title.textContent = '编辑成员';
    const m = data.members.find(x => x.id === editId);
    if (m) {
      document.getElementById('memberName').value = m.name;
      document.getElementById('memberCapital').value = m.initialCapital;
    }
  } else {
    title.textContent = '添加成员';
    document.getElementById('memberName').value = '';
    document.getElementById('memberCapital').value = '100000';
  }
  modal.classList.remove('hidden');
  setTimeout(() => document.getElementById('memberName').focus(), 100);
}

function closeMemberModal() {
  document.getElementById('memberModal').classList.add('hidden');
  document.getElementById('memberEditId').value = '';
}

function saveMember() {
  const name = document.getElementById('memberName').value.trim();
  const capital = document.getElementById('memberCapital').value;
  const editId = document.getElementById('memberEditId').value;
  if (!name) { showToast('⚠️ 请输入成员姓名'); return; }
  if (!capital || parseFloat(capital) <= 0) { showToast('⚠️ 请输入有效的初始资金'); return; }
  if (editId) {
    updateMember(editId, name, parseFloat(capital));
  } else {
    addMember(name, parseFloat(capital));
  }
  closeMemberModal();
}

function editMember(id) {
  showMemberModal(id);
}

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  const isError = msg.startsWith('❌') || msg.startsWith('⚠️');
  const bgClass = isError ? 'bg-rose-600' : 'bg-slate-800';
  toast.innerHTML = `<div class="${bgClass} text-white px-5 py-3 rounded-2xl shadow-xl shadow-slate-900/20 text-sm font-medium flex items-center gap-2 backdrop-blur">${msg}</div>`;
  toast.classList.remove('hidden');
  toast.style.animation = 'none';
  toast.offsetHeight; // reflow
  toast.style.animation = 'slideIn 0.3s ease';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.style.animation = 'fadeOut 0.3s ease forwards';
    setTimeout(() => toast.classList.add('hidden'), 300);
  }, 2000);
}

// ==================== 数据导出导入 ====================
function exportData() {
  if (data.members.length === 0 && data.weeks.length === 0) { showToast('⚠️ 没有数据可导出'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `炒股大赛数据_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('导入将覆盖当前所有数据，确定继续吗？')) { event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.members || !imported.weeks) throw new Error('数据格式错误');
      const defaultYuEBao = { enabled: true, annualRate: 1.8, initialCapital: 100000 };
      data = { members: imported.members, weeks: imported.weeks, yuEBao: imported.yuEBao || defaultYuEBao };
      autoSave(false);
      showToast('✅ 数据已导入本地，点击上传按钮同步到 GitHub');
    } catch (err) {
      showToast('❌ 导入失败，请检查文件格式');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('确定要清空所有数据吗？此操作不可撤销！\n\n建议先导出备份。')) return;
  data = { members: [], weeks: [], yuEBao: { enabled: true, annualRate: 1.8, initialCapital: 100000 } };
  autoSave(false);
  showToast('✅ 已在本地清空，点击上传按钮同步到 GitHub');
}

function showDemoData() {
  if (data.members.length > 0 || data.weeks.length > 0) {
    if (!confirm('加载示例数据将覆盖当前数据，确定继续吗？')) return;
  }

  const names = ['张三', '李四', '王五', '赵六', '陈七'];
  const initials = [100000, 100000, 150000, 80000, 120000];
  const members = names.map((name, i) => ({
    id: 'demo_m' + i,
    name,
    initialCapital: initials[i],
    color: COLORS[i]
  }));

  // Generate 8 weeks of demo data with some variation
  const weeks = [];
  const baseDate = new Date('2026-04-15');
  // Base performance curves (different trajectories for each member)
  const trajectories = [
    [0.02, 0.05, 0.03, 0.08, 0.07, 0.12, 0.10, 0.15],   // 张三: steady growth
    [0.01, -0.02, 0.00, 0.03, -0.01, 0.05, 0.08, 0.06],  // 李四: volatile
    [0.05, 0.08, 0.06, 0.04, 0.10, 0.09, 0.07, 0.11],    // 王五: good growth
    [-0.01, -0.03, 0.01, -0.02, 0.02, 0.00, 0.04, 0.03], // 赵六: struggling
    [0.03, 0.06, 0.09, 0.07, 0.11, 0.14, 0.13, 0.18],    // 陈七: best performer
  ];

  for (let w = 0; w < 8; w++) {
    const d = new Date(baseDate);
    d.setDate(d.getDate() + w * 7);
    const values = {};
    members.forEach((m, mi) => {
      const rr = trajectories[mi][w];
      values[m.id] = Math.round(m.initialCapital * (1 + rr));
    });
    weeks.push({
      id: 'demo_w' + w,
      label: `第${w + 1}周`,
      date: d.toISOString().split('T')[0],
      values
    });
  }

  data = { members, weeks, yuEBao: { enabled: true, annualRate: 1.8, initialCapital: 100000 } };
  autoSave(false);
  showToast('✅ 示例数据已加载到本地，点击上传按钮同步到 GitHub');
}

// ==================== 工具函数 ====================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 初始化 ====================
(async function init() {
  updateTokenBadge();
  await loadData();
  renderAll();
})();
</script>
