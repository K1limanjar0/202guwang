<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>202股王大赛</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* ========== 基础与背景 ========== */
  body {
    background: #f8fafc;
    background-image: radial-gradient(circle, #e2e8f0 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== 卡片 ========== */
  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(226,232,240,0.8);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.03);
    transition: box-shadow 0.3s, transform 0.3s;
  }
  .card:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05); }

  /* ========== 按钮 ========== */
  .btn {
    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
    box-shadow: 0 2px 8px rgba(99,102,241,0.35);
  }
  .btn-primary:hover {
    box-shadow: 0 4px 16px rgba(99,102,241,0.45);
    transform: translateY(-1px);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(203,213,225,0.6);
    color: #475569;
  }
  .btn-ghost:hover { background: rgba(248,250,252,0.9); border-color: #94a3b8; }

  /* ========== 数据表格 ========== */
  .sticky-left { position: sticky; left: 0; z-index: 5; background: inherit; }
  .sticky-left-2 { position: sticky; left: 140px; z-index: 4; background: inherit; }
  thead th {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #f8fafc, #f1f5f9);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.7rem;
    color: #64748b;
  }
  thead th.sticky-left { z-index: 12; }
  thead th.sticky-left-2 { z-index: 11; }
  .table-cell-input {
    width: 100px; text-align: center;
    border: 1.5px solid transparent; border-radius: 10px;
    padding: 8px 6px; transition: all 0.2s;
    background: rgba(248,250,252,0.6);
    font-variant-numeric: tabular-nums;
  }
  .table-cell-input:hover { border-color: #cbd5e1; background: #fff; }
  .table-cell-input:focus {
    border-color: #818cf8; background: #fff; outline: none;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
  }
  .table-row { transition: all 0.15s; }
  .table-row:hover { background: rgba(238,242,255,0.5) !important; }

  /* ========== 收益率颜色 ========== */
  .return-positive { color: #10b981; font-weight: 600; }
  .return-negative { color: #ef4444; font-weight: 600; }

  /* ========== 模态框 ========== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    z-index: 50; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); animation: fadeIn 0.2s ease;
  }
  .modal {
    background: white; border-radius: 24px; padding: 28px;
    width: 90%; max-width: 460px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.2);
    animation: modalIn 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes modalIn { from { transform: scale(0.92) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ========== Toast ========== */
  .toast {
    position: fixed; top: 24px; right: 24px; z-index: 100;
    animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes slideIn { from { transform: translateX(120%) scale(0.9); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

  /* ========== 排名徽章 ========== */
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 12px;
    font-weight: 700; font-size: 15px;
  }
  .rank-1 { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #b45309; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
  .rank-2 { background: linear-gradient(135deg, #f1f5f9, #e2e8f0); color: #475569; }
  .rank-3 { background: linear-gradient(135deg, #fef2f2, #fee2e2); color: #b45309; }

  /* ========== 图表切换 ========== */
  .chart-toggle {
    cursor: pointer; padding: 8px 20px; border-radius: 24px;
    font-size: 13px; font-weight: 600; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .chart-toggle.active {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
    box-shadow: 0 2px 8px rgba(99,102,241,0.35);
  }
  .chart-toggle:not(.active) { background: transparent; color: #94a3b8; }
  .chart-toggle:not(.active):hover { color: #6366f1; background: rgba(99,102,241,0.06); }

  /* ========== 滚动条 ========== */
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* ========== 自定义输入框 ========== */
  .input-modern {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; transition: all 0.2s;
    background: #f8fafc; outline: none;
  }
  .input-modern:focus {
    border-color: #818cf8; background: white;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  .input-modern::placeholder { color: #94a3b8; }

  /* ========== 斑马纹和悬停 ========== */
  .row-even { background: rgba(255,255,255,0.6); }
  .row-odd { background: rgba(248,250,252,0.5); }
  .row-hover:hover { background: rgba(238,242,255,0.6) !important; }

  /* ========== 入场动画 ========== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeInUp 0.4s ease both; }
  .delay-1 { animation-delay: 0.05s; }
  .delay-2 { animation-delay: 0.1s; }
  .delay-3 { animation-delay: 0.15s; }

  /* ========== 统计数字跳动 ========== */
  @keyframes countIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .stat-number { animation: countIn 0.4s cubic-bezier(0.4,0,0.2,1) both; }

  /* ========== 脉冲指示 ========== */
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .live-dot { animation: pulse-dot 2s ease-in-out infinite; }

  /* ========== 现代表单 ========== */
  .form-label { font-size: 0.8rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body class="min-h-screen">

<!-- Header -->

  <div class="absolute inset-0 opacity-[0.07]" style="background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>'); background-size: 200px;"></div>

        <div class="flex items-center gap-3 mb-1">

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

  <!-- Toolbar -->
  <div class="card p-3 flex flex-wrap items-center gap-2 animate-in" id="toolbar">
    <button onclick="showMemberModal()" class="btn btn-primary px-5 py-2.5 rounded-xl text-sm">

    <button onclick="addWeek()" class="btn btn-ghost px-5 py-2.5 rounded-xl text-sm">

    <button onclick="showTokenModal()" class="btn btn-ghost px-3.5 py-2.5 rounded-xl text-sm" title="设置 GitHub Token 以同步数据">

  <!-- 余额宝基准设置 -->

    <div class="flex items-center justify-between flex-wrap gap-3">

      <button onclick="showMemberModal()" class="btn bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-indigo-700">

      <button onclick="showDemoData()" class="btn bg-white border border-gray-300 px-6 py-2.5 rounded-lg font-medium hover:bg-gray-50 text-gray-700">

  <!-- Data Table Section -->

<!-- Member Modal -->
<div id="memberModal" class="modal-overlay hidden" onclick="if(event.target===this)closeMemberModal()">

    <div class="space-y-4">

      <div class="flex gap-3 justify-end pt-4">
        <button onclick="closeMemberModal()" class="btn px-5 py-2.5 rounded-xl text-sm border border-slate-200 hover:bg-slate-50 text-slate-600 font-medium">取消</button>
        <button onclick="saveMember()" class="btn btn-primary px-6 py-2.5 rounded-xl text-sm">保存</button>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script>
// ==================== 数据管理（GitHub API 同步）====================
const REPO_OWNER = 'K1limanjar0';
const REPO_NAME = '202guwang';
const DATA_FILE = 'data.json';
const RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DATA_FILE}`;
const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`;

const COLORS = ['#4F46E5','#EF4444','#10B981','#F59E0B','#8B5CF6','#EC4899','#06B6D4','#F97316','#84CC16','#6366F1','#14B8A6','#E11D48'];

let data = { members: [], weeks: [], yuEBao: { enabled: true, annualRate: 1.8, initialCapital: 100000 } };
let chartMode = 'absolute';
let chart = null;
let saving = false;
let dataSha = null;
let githubToken = localStorage.getItem('gh_token_202guwang') || '';

async function loadData() {
  try {
    const resp = await fetch(RAW_URL + '?_=' + Date.now());
    if (resp.ok) {
      const parsed = await resp.json();
      const defaultYuEBao = { enabled: true, annualRate: 1.8, initialCapital: 100000 };
      data = { members: parsed.members || [], weeks: parsed.weeks || [], yuEBao: parsed.yuEBao || defaultYuEBao };
    }
  } catch (e) { console.error('加载数据失败:', e); }
}

async function fetchLatestSha() {
  if (!githubToken) return null;
  try {
    const resp = await fetch(API_URL + '?_=' + Date.now(), {
      headers: { 'Authorization': 'Bearer ' + githubToken }
    });
    if (resp.ok) {
      const info = await resp.json();
      dataSha = info.sha;
      return info.sha;
    } else {
      console.error('SHA fetch failed:', resp.status, await resp.text());
    }
  } catch(e) {
    console.error('SHA fetch error:', e);
  }
  return null;
}

async function saveData(silent) {
  if (saving) return;
  if (!githubToken) {
    if (!silent) { showToast('🔑 请先设置 GitHub Token'); showTokenModal(); }
    return;
  }
  saving = true;
  try {
    // 先获取最新 SHA（必须成功才能继续）
    const sha = await fetchLatestSha();
    if (!sha) {
      showToast('❌ 无法获取文件信息，请检查 Token 权限（需要 Contents: Read and write）');
      saving = false;
      return;
    }

    // 上传数据
    const jsonStr = JSON.stringify(data, null, 2);
    const content = btoa(unescape(encodeURIComponent(jsonStr)));
    const resp = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + githubToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: '更新数据 ' + new Date().toLocaleString('zh-CN'), content, sha })
    });

    if (resp.ok) {
      const result = await resp.json();
      dataSha = result.content.sha;
      renderAll();
      if (!silent) showToast('✅ 数据已同步');
    } else {
      const err = await resp.json().catch(() => ({}));
      showToast('❌ ' + (err.message || '保存失败，检查Token'));
    }
  } catch (e) {
    showToast('❌ 网络错误，同步失败');
  }
  saving = false;
}

function autoSave() { saveData(true); }

async function refreshData() {
  await loadData();
  renderAll();
  showToast('🔄 数据已刷新');
}

function setGitHubToken(token) {
  githubToken = token.trim();
  if (githubToken) {
    localStorage.setItem('gh_token_202guwang', githubToken);
  } else {
    localStorage.removeItem('gh_token_202guwang');
  }
  updateTokenBadge();
}

function updateTokenBadge() {
  const badge = document.getElementById('tokenBadge');
  if (badge) {
    badge.className = githubToken ? 'text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold' : 'text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold cursor-pointer';
    badge.textContent = githubToken ? '可写入' : '只读';
    badge.title = githubToken ? 'Token 已设置，数据会同步到 GitHub' : '点击设置 Token 以写入数据';
    badge.onclick = githubToken ? null : showTokenModal;
  }
}

function showTokenModal() {
  const token = prompt('请输入 GitHub Personal Access Token（Fine-grained token）：\n\n1. 打开 https://github.com/settings/tokens\n2. 创建 Fine-grained token\n3. 选择仓库 K1limanjar0/202guwang\n4. 权限勾选 Contents (Read and write)\n5. 复制 token 粘贴到这里\n\n留空可清除已保存的 token（变为只读模式）', githubToken);
  if (token !== null) {
    setGitHubToken(token);
    if (token) showToast('✅ Token 已保存，可同步数据'); else showToast('📖 已切换为只读模式');
    location.reload();
  }
}

// ==================== 成员操作 ====================
function addMember(name, initialCapital) {
  const id = 'm' + Date.now();
  const colorIdx = data.members.length % COLORS.length;
  data.members.push({ id, name, initialCapital: parseFloat(initialCapital) || 100000, color: COLORS[colorIdx] });
  saveData();
}

function updateMember(id, name, initialCapital) {
  const m = data.members.find(x => x.id === id);
  if (m) { m.name = name; m.initialCapital = parseFloat(initialCapital) || 100000; }
  saveData();
}

function deleteMember(id) {
  if (!confirm('确定要删除该成员及其所有数据吗？此操作不可撤销。')) return;
  data.members = data.members.filter(m => m.id !== id);
  data.weeks.forEach(w => { delete w.values[id]; });
  saveData();
}

// ==================== 周操作 ====================
function addWeek() {
  if (data.members.length === 0) { showToast('⚠️ 请先添加成员'); return; }
  const n = data.weeks.length + 1;
  const id = 'w' + Date.now();
  const today = new Date().toISOString().split('T')[0];
  const values = {};
  data.members.forEach(m => { values[m.id] = null; });
  data.weeks.push({ id, label: `第${n}周`, date: today, values });
  saveData();
}

function deleteWeek(id) {
  if (!confirm('确定要删除该周的所有记录吗？此操作不可撤销。')) return;
  data.weeks = data.weeks.filter(w => w.id !== id);
  // Re-label remaining weeks
  data.weeks.forEach((w, i) => { w.label = `第${i + 1}周`; });
  saveData();
}

function updateWeekValue(weekId, memberId, value) {
  const week = data.weeks.find(w => w.id === weekId);
  if (!week) return;
  week.values[memberId] = value === '' || value === null ? null : parseFloat(value);
  autoSave();
}

function updateWeekLabel(weekId, newLabel) {
  const week = data.weeks.find(w => w.id === weekId);
  if (week) { week.label = newLabel; autoSave(); }
}

function updateWeekDate(weekId, newDate) {
  const week = data.weeks.find(w => w.id === weekId);
  if (week) { week.date = newDate; autoSave(); }
}

// ==================== 计算 ====================
function getReturnRate(member, weekValue) {
  if (weekValue === null || weekValue === undefined || member.initialCapital === 0) return null;
  return ((weekValue - member.initialCapital) / member.initialCapital * 100);
}

function getLatestReturnRate(member) {
  let lastVal = null;
  for (let i = data.weeks.length - 1; i >= 0; i--) {
    const v = data.weeks[i].values[member.id];
    if (v !== null && v !== undefined) { lastVal = v; break; }
  }
  return lastVal !== null ? getReturnRate(member, lastVal) : null;
}

function getLatestValue(member) {
  for (let i = data.weeks.length - 1; i >= 0; i--) {
    const v = data.weeks[i].values[member.id];
    if (v !== null && v !== undefined) return v;
  }
  return null;
}

function getRanking() {
  return data.members
    .map(m => ({ ...m, returnRate: getLatestReturnRate(m), latestValue: getLatestValue(m) }))
    .sort((a, b) => {
      if (a.returnRate === null && b.returnRate === null) return 0;
      if (a.returnRate === null) return 1;
      if (b.returnRate === null) return -1;
      return b.returnRate - a.returnRate;
    });
}

// ==================== 余额宝基准计算 ====================
function getYuEBaoValue(weekIndex) {
  if (!data.yuEBao || !data.yuEBao.enabled) return null;
  const { annualRate, initialCapital } = data.yuEBao;
  const weeklyRate = Math.pow(1 + annualRate / 100, 1 / 52) - 1;
  return Math.round(initialCapital * Math.pow(1 + weeklyRate, weekIndex + 1));
}

function getYuEBaoReturnRate(weekIndex) {
  if (!data.yuEBao || !data.yuEBao.enabled) return null;
  const value = getYuEBaoValue(weekIndex);
  if (value === null) return null;
  return ((value - data.yuEBao.initialCapital) / data.yuEBao.initialCapital * 100);
}

function getYuEBaoLatestReturnRate() {
  if (data.weeks.length === 0) return null;
  return getYuEBaoReturnRate(data.weeks.length - 1);
}

function getYuEBaoLatestValue() {
  if (data.weeks.length === 0) return null;
  return getYuEBaoValue(data.weeks.length - 1);
}

function saveYuEBaoSettings() {
  const enabled = document.getElementById('yuebaoEnabled').checked;
  const annualRate = parseFloat(document.getElementById('yuebaoRate').value) || 1.8;
  const initialCapital = parseFloat(document.getElementById('yuebaoCapital').value) || 100000;
  data.yuEBao = { enabled, annualRate, initialCapital };
  autoSave();
}

function renderChart() {
  const canvas = document.getElementById('mainChart');
  const ctx = canvas.getContext('2d');

  if (chart) { chart.destroy(); chart = null; }

  if (data.members.length === 0 || data.weeks.length === 0) {
    // Draw empty state on canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '16px -apple-system, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据，请添加成员和周记录', canvas.width / 2, canvas.height / 2);
    return;
  }

  const labels = data.weeks.map(w => w.label);

  // 为每个成员创建渐变色
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const datasets = data.members.map(member => {
    // 创建 canvas 渐变（在 afterLayout 中处理）
    return {
      label: member.name,
      data: data.weeks.map(w => {
        const v = w.values[member.id];
        if (v === null || v === undefined) return null;
        if (chartMode === 'absolute') return v;
        return parseFloat(getReturnRate(member, v).toFixed(2));
      }),
      borderColor: member.color,
      backgroundColor: hexToRgba(member.color, 0.08),
      borderWidth: 3,
      pointRadius: 5,
      pointHoverRadius: 8,
      pointBackgroundColor: member.color,
      pointBorderColor: 'white',
      pointBorderWidth: 3,
      tension: 0.4,
      spanGaps: false,
      fill: true,
    };
  });

  // 余额宝基准线
  if (data.yuEBao && data.yuEBao.enabled && data.weeks.length > 0) {
    const ybColor = '#F59E0B';
    datasets.push({
      label: '💰 余额宝基准',
      data: data.weeks.map((_, i) => {
        if (chartMode === 'absolute') return getYuEBaoValue(i);
        return parseFloat(getYuEBaoReturnRate(i).toFixed(2));
      }),
      borderColor: ybColor,
      backgroundColor: 'rgba(245,158,11,0.06)',
      borderWidth: 3,
      borderDash: [8, 4],
      pointRadius: 4,
      pointHoverRadius: 7,
      pointBackgroundColor: ybColor,
      pointBorderColor: 'white',
      pointBorderWidth: 2,
      pointStyle: 'rectRounded',
      tension: 0.4,
      spanGaps: false,
      fill: true,
      order: 1,
    });
  }

  // 余额宝基准线颜色零线 (收益率模式)
  const ybZeroLine = {
    id: 'ybZeroLine',
    afterDraw(chart) {
      if (chartMode === 'return') {
        const yScale = chart.scales.y;
        const xScale = chart.scales.x;
        const yPos = yScale.getPixelForValue(0);
        if (yPos >= yScale.top && yPos <= yScale.bottom) {
          const ctx = chart.ctx;
          ctx.save();
          ctx.beginPath();
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1;
          ctx.moveTo(xScale.left, yPos);
          ctx.lineTo(xScale.right, yPos);
          ctx.stroke();
          ctx.restore();
        }
      }
    }
  };

  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    plugins: [ybZeroLine],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            usePointStyle: true, pointStyleWidth: 10, padding: 24,
            font: { size: 13, family: "-apple-system, 'Microsoft YaHei', sans-serif", weight: '500' },
            color: '#475569',
            generateLabels: function(chart) {
              const items = Chart.defaults.plugins.legend.labels.generateLabels(chart);
              return items.map(item => ({
                ...item,
                fillStyle: item.datasetIndex < data.members.length ?
                  hexToRgba(data.members[item.datasetIndex].color, 0.15) : 'transparent'
              }));
            }
          }
        },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,0.92)',
          titleFont: { size: 13, weight: '600' },
          bodyFont: { size: 13 },
          padding: 14,
          cornerRadius: 12,
          displayColors: true,
          boxPadding: 6,
          callbacks: {
            label: function(ctx) {
              if (ctx.parsed.y === null || ctx.parsed.y === undefined) return ctx.dataset.label + ': 无数据';
              if (chartMode === 'absolute') return ctx.dataset.label + ': ¥' + ctx.parsed.y.toLocaleString();
              return ctx.dataset.label + ': ' + (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + '%';
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 12, weight: '500' }, color: '#94a3b8' }
        },
        y: {
          grid: { color: '#f1f5f9', drawBorder: false },
          border: { display: false },
          ticks: {
            font: { size: 11 },
            color: '#94a3b8',
            padding: 8,
            callback: function(v) {
              if (chartMode === 'absolute') {
                if (v >= 10000) return (v / 10000).toFixed(1) + '万';
                return v.toLocaleString();
              }
              return v.toFixed(1) + '%';
            }
          }
        }
      }
    }
  });
}

  renderChart();
}

// ==================== 模态框 ====================
function showMemberModal(editId) {
  const modal = document.getElementById('memberModal');
  const title = document.getElementById('memberModalTitle');
  document.getElementById('memberEditId').value = editId || '';
  if (editId) {
    title.textContent = '编辑成员';
    const m = data.members.find(x => x.id === editId);
    if (m) {
      document.getElementById('memberName').value = m.name;
      document.getElementById('memberCapital').value = m.initialCapital;
    }
  } else {
    title.textContent = '添加成员';
    document.getElementById('memberName').value = '';
    document.getElementById('memberCapital').value = '100000';
  }
  modal.classList.remove('hidden');
  setTimeout(() => document.getElementById('memberName').focus(), 100);
}

function closeMemberModal() {
  document.getElementById('memberModal').classList.add('hidden');
  document.getElementById('memberEditId').value = '';
}

function saveMember() {
  const name = document.getElementById('memberName').value.trim();
  const capital = document.getElementById('memberCapital').value;
  const editId = document.getElementById('memberEditId').value;
  if (!name) { showToast('⚠️ 请输入成员姓名'); return; }
  if (!capital || parseFloat(capital) <= 0) { showToast('⚠️ 请输入有效的初始资金'); return; }
  if (editId) {
    updateMember(editId, name, parseFloat(capital));
  } else {
    addMember(name, parseFloat(capital));
  }
  closeMemberModal();
}

function editMember(id) {
  showMemberModal(id);
}

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  const isError = msg.startsWith('❌') || msg.startsWith('⚠️');
  const bgClass = isError ? 'bg-rose-600' : 'bg-slate-800';
  toast.innerHTML = `<div class="${bgClass} text-white px-5 py-3 rounded-2xl shadow-xl shadow-slate-900/20 text-sm font-medium flex items-center gap-2 backdrop-blur">${msg}</div>`;
  toast.classList.remove('hidden');
  toast.style.animation = 'none';
  toast.offsetHeight; // reflow
  toast.style.animation = 'slideIn 0.3s ease';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.style.animation = 'fadeOut 0.3s ease forwards';
    setTimeout(() => toast.classList.add('hidden'), 300);
  }, 2000);
}

// ==================== 数据导出导入 ====================
function exportData() {
  if (data.members.length === 0 && data.weeks.length === 0) { showToast('⚠️ 没有数据可导出'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `炒股大赛数据_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('导入将覆盖当前所有数据，确定继续吗？')) { event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.members || !imported.weeks) throw new Error('数据格式错误');
      const defaultYuEBao = { enabled: true, annualRate: 1.8, initialCapital: 100000 };
      data = { members: imported.members, weeks: imported.weeks, yuEBao: imported.yuEBao || defaultYuEBao };
      saveData();
      showToast('✅ 数据导入成功');
    } catch (err) {
      showToast('❌ 导入失败，请检查文件格式');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('确定要清空所有数据吗？此操作不可撤销！\n\n建议先导出备份。')) return;
  data = { members: [], weeks: [], yuEBao: { enabled: true, annualRate: 1.8, initialCapital: 100000 } };
  saveData();
  showToast('✅ 数据已重置');
}

function showDemoData() {
  if (data.members.length > 0 || data.weeks.length > 0) {
    if (!confirm('加载示例数据将覆盖当前数据，确定继续吗？')) return;
  }

  const names = ['张三', '李四', '王五', '赵六', '陈七'];
  const initials = [100000, 100000, 150000, 80000, 120000];
  const members = names.map((name, i) => ({
    id: 'demo_m' + i,
    name,
    initialCapital: initials[i],
    color: COLORS[i]
  }));

  // Generate 8 weeks of demo data with some variation
  const weeks = [];
  const baseDate = new Date('2026-04-15');
  // Base performance curves (different trajectories for each member)
  const trajectories = [
    [0.02, 0.05, 0.03, 0.08, 0.07, 0.12, 0.10, 0.15],   // 张三: steady growth
    [0.01, -0.02, 0.00, 0.03, -0.01, 0.05, 0.08, 0.06],  // 李四: volatile
    [0.05, 0.08, 0.06, 0.04, 0.10, 0.09, 0.07, 0.11],    // 王五: good growth
    [-0.01, -0.03, 0.01, -0.02, 0.02, 0.00, 0.04, 0.03], // 赵六: struggling
    [0.03, 0.06, 0.09, 0.07, 0.11, 0.14, 0.13, 0.18],    // 陈七: best performer
  ];

  for (let w = 0; w < 8; w++) {
    const d = new Date(baseDate);
    d.setDate(d.getDate() + w * 7);
    const values = {};
    members.forEach((m, mi) => {
      const rr = trajectories[mi][w];
      values[m.id] = Math.round(m.initialCapital * (1 + rr));
    });
    weeks.push({
      id: 'demo_w' + w,
      label: `第${w + 1}周`,
      date: d.toISOString().split('T')[0],
      values
    });
  }

  data = { members, weeks, yuEBao: { enabled: true, annualRate: 1.8, initialCapital: 100000 } };
  saveData();
  showToast('✅ 示例数据已加载');
}

// ==================== 工具函数 ====================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 初始化 ====================
(async function init() {
  updateTokenBadge();
  await loadData();
  renderAll();
  // 每15秒自动刷新一次
  setInterval(async () => {
    await loadData();
    renderAll();
  }, 15000);
})();
</script>
